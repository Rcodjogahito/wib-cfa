name: Weekly Heartbeat

# Runs every Monday at 08:00 UTC.
# Makes a tiny timestamp commit to reset GitHub's 60-day inactivity timer,
# which would otherwise disable all scheduled workflows (including keep-alive).
# Weekly cadence gives a 7-day safety margin instead of 30 days.

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update heartbeat timestamp
        run: |
          echo "Last heartbeat: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "chore: weekly heartbeat $(date -u '+%Y-%m-%d')"
          git push
