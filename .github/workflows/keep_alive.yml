name: Keep App Alive

on:
  schedule:
    # Ping every 6 hours — well under Streamlit Cloud's inactivity threshold
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WIB CFA app
        run: |
          # No -L: Streamlit auth redirects indefinitely; a 303 response means the app is alive.
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://wib-cfa.streamlit.app/)
          echo "HTTP status: $response"
          # Any 2xx or 3xx means the app is reachable and awake
          if [ "${response:0:1}" = "2" ] || [ "${response:0:1}" = "3" ]; then
            echo "App is alive (status $response)."
          else
            echo "ERROR: App may be down (status $response)."
            exit 1
          fi
