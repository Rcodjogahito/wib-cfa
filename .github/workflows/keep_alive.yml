name: Keep App Alive

# Runs every hour at :30 (offset from the Playwright workflow at :00).
# Always dispatches the Playwright workflow — HTTP-level checks cannot
# distinguish sleeping from awake (Streamlit Cloud ALWAYS returns 303
# on first hop regardless of app state — it's the auth redirect layer).
# Only Playwright (real browser + JS) can detect and wake a sleeping app.

on:
  schedule:
    - cron: '30 * * * *'   # every hour at :30 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Playwright keep-alive
        run: |
          # Always trigger the Playwright workflow so it runs every 30 min
          # (alternating with its own :00 schedule).
          # Note: HTTP 303 on the root URL is the Streamlit Cloud auth redirect
          # and appears for BOTH sleeping and awake apps — it cannot be used
          # to detect sleeping state. Only a real browser can detect sleep.
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/dispatches \
            -d '{"ref":"master"}'
          echo "Playwright keep-alive dispatched — will run in ~30s."
          exit 0
