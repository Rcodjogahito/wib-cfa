name: Keep-alive WIB CFA

# Runs every hour. When the app is awake, registers real browser traffic.
# When sleeping, uses Playwright to find and click the "back up" wake button.
# Always exits 0 so consecutive "failures" never cause GitHub to disable the cron.

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour, UTC
  workflow_dispatch:          # Manual trigger from GitHub Actions tab

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Playwright
        run: |
          pip install playwright -q
          playwright install chromium --with-deps

      - name: Check and wake up WIB CFA
        run: |
          python3 - <<'PYEOF'
          import asyncio, sys
          from playwright.async_api import async_playwright, TimeoutError as PwTimeout

          APP_URL = "https://wib-cfa.streamlit.app/"
          SLEEP_MARKERS = ("Zzzz", "gone to sleep", "get this app back up", "back up")

          def is_sleeping(html: str) -> bool:
              low = html.lower()
              return ("zzzz" in low) or ("gone to sleep" in low) or ("get this app back up" in low)

          async def try_wake(page) -> bool:
              """Find any wake button and click it. Returns True if a click happened."""
              # Strategy 1: button containing "back up"
              for selector in (
                  'button:has-text("back up")',
                  'button:has-text("get this app")',
                  '[data-testid="wakeup-button-viewer"]',
              ):
                  try:
                      loc = page.locator(selector).first
                      if await loc.count() > 0:
                          await loc.click(timeout=10_000)
                          print(f"Clicked wake button via selector: {selector}")
                          return True
                  except Exception as e:
                      print(f"Selector {selector} failed: {e}")
              # Strategy 2: text fallback
              try:
                  btn = page.get_by_text("Yes, get this app back up!")
                  if await btn.count() > 0:
                      await btn.first.click(timeout=10_000)
                      print("Clicked wake button via exact text.")
                      return True
              except Exception as e:
                  print(f"Text fallback failed: {e}")
              # Strategy 3: first visible button on the sleep page
              try:
                  any_btn = page.get_by_role("button").first
                  if await any_btn.count() > 0:
                      await any_btn.click(timeout=10_000)
                      print("Clicked first available button as last resort.")
                      return True
              except Exception as e:
                  print(f"Role-button fallback failed: {e}")
              return False

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
                  page = await browser.new_page(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                 "AppleWebKit/537.36 (KHTML, like Gecko) "
                                 "Chrome/124.0.0.0 Safari/537.36"
                  )

                  print(f"Visiting {APP_URL} ...")
                  try:
                      await page.goto(APP_URL, timeout=60_000, wait_until="domcontentloaded")
                  except PwTimeout:
                      print("Timeout on initial load — app may be starting up. Treating as OK.")
                      await browser.close()
                      return

                  content = await page.content()

                  if not is_sleeping(content):
                      print("App is awake and responding — real traffic registered, no action needed.")
                      await browser.close()
                      return

                  # App is sleeping — attempt up to 2 wake passes.
                  print("App appears to be sleeping — attempting wake ...")
                  for attempt in (1, 2):
                      print(f"Wake attempt {attempt} ...")
                      clicked = await try_wake(page)
                      if clicked:
                          print("Waiting 60 s for boot ...")
                          await page.wait_for_timeout(60_000)
                      else:
                          print("No wake button found on this pass.")
                      try:
                          await page.reload(timeout=60_000, wait_until="domcontentloaded")
                      except PwTimeout:
                          print("Reload timed out — app likely booting.")
                      content = await page.content()
                      if not is_sleeping(content):
                          print("SUCCESS: app is now awake!")
                          break
                      if attempt == 1:
                          print("Still sleeping — waiting 30 s before retry ...")
                          await page.wait_for_timeout(30_000)
                  else:
                      print("WARNING: app still reported sleeping after retries. "
                            "Will be retried next hour / by curl trigger. Exiting 0 to keep cron alive.")

                  await browser.close()

          # Never fail the job: a non-zero exit can lead GitHub to disable the schedule.
          try:
              asyncio.run(main())
          except Exception as e:
              print(f"Unhandled error (suppressed to keep cron alive): {e}")
          sys.exit(0)
          PYEOF
